<!DOCTYPE html>
<!--
wolfdenOS — Custom LG webOS Deployment Stage
-->
<html>

<head>
    <meta charset="UTF-8">
    <title>wolfdenOS</title>
    <style>
        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at 50% 40%, #1e0b3a 0%, #070312 100%);
            color: #f3e8ff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 48px 64px;
            /* Centred as a single block: on a 1080p panel the old top-left
               layout left everything stranded in the corner. */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        h1 {
            font-size: 46px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #c084fc;
            font-size: 20px;
            margin-bottom: 28px;
        }

        /* Progress detail and debug chatter were small, low-contrast lines of
           text on a TV nobody reads from the couch. Kept in the DOM so the
           existing logging calls stay valid, but not shown. */
        #debug,
        #status {
            display: none;
        }

        /* Errors stay visible and readable: they are the one thing worth
           showing on screen when something goes wrong. */
        #error {
            color: #fb7185;
            font-size: 22px;
            max-width: 1100px;
            line-height: 1.45;
        }


        .stage-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 10px 0 18px 0;
        }

        /* Pure CSS so there is nothing to download while we are mid-deploy. */
        #spinner {
            width: 34px;
            height: 34px;
            flex: none;
            border: 4px solid rgba(192, 132, 252, 0.28);
            border-top-color: #c084fc;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        #spinner.done {
            animation: none;
            border-color: rgba(134, 239, 172, 0.35);
            border-top-color: #86efac;
        }

        #spinner.failed {
            animation: none;
            border-color: rgba(251, 113, 133, 0.35);
            border-top-color: #fb7185;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #phase {
            color: #ffffff;
            font-size: 26px;
            font-weight: 500;
        }

        #hint {
            color: #a78bfa;
            font-size: 20px;
            margin-top: 26px;
            max-width: 1000px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <h1>wolfdenOS</h1>
    <p class="subtitle">home screen install &amp; system patches</p>
    <div class="stage-row">
        <div id="spinner"></div>
        <div id="phase">Starting&hellip;</div>
    </div>
    <p id="status"></p>
    <p id="debug"></p>
    <p id="error"></p>
    <p id="hint"></p>
    <script>
        (function () {
            function getQueryParam(name) {
                var query = location.search.substring(1);
                var vars = query.split('&');
                for (var i = 0; i < vars.length; i++) {
                    var pair = vars[i].split('=');
                    if (pair[0] === name) {
                        // Returns undefined if there's no value
                        return pair[1];
                    }
                }
                return null;
            }

            // Get options from query parameters
            var optDebug = getQueryParam('debug') !== null;
            var optTelnet = getQueryParam('telnet') !== null;
            var optCurlInsecure = getQueryParam('curl-insecure') !== null;

            var shellScriptName = (function () {
                var rawScript = getQueryParam('script');

                if (rawScript === null) {
                    // XXX: This should be an error: script required
                    return '';
                }

                return rawScript;
            })();

            var files = (function () {
                var rawFiles = getQueryParam('files');

                if (rawFiles === null) {
                    // XXX: This should be an error: files required
                    return [];
                }

                return rawFiles.split(';');
            })();

            var fakeServicePath = (function () {
                var rawFakePath = getQueryParam('fake-service-path');

                if (rawFakePath === null) {
                    // The query parameter was not provided; fine
                    return null;
                }

                if ((typeof rawFakePath !== 'string') || (rawFakePath.length === 0)) {
                    // XXX: Should be an error: must be a non-empty string
                    return null;
                }

                return rawFakePath;
            })();

            var statusElem = document.getElementById('status');
            var debugElem = document.getElementById('debug');
            var errorElem = document.getElementById('error');

            var spinnerElem = document.getElementById('spinner');
            var phaseElem = document.getElementById('phase');
            var hintElem = document.getElementById('hint');

            // The phase line is the one-glance state; status carries detail.
            function setPhase(message, state) {
                phaseElem.textContent = message;
                spinnerElem.className = state || '';
            }

            function setHint(message) {
                hintElem.textContent = message || '';
            }

            function logStatus(message) {
                statusElem.textContent = 'wolfdenOS: ' + message;
            }

            function logDebug(message) {
                // Only show debug messages if the debug option is enabled
                if (optDebug) {
                    debugElem.textContent = 'wolfdenOS Debug: ' + message;
                }
            }

            function logError(message) {
                errorElem.textContent = 'wolfdenOS Error: ' + message;
            }

            function failedValidation(context, message) {
                logError('invalid response to ' + context + ': ' + message);
            }

            function checkPropertyType(obj, context, property, type) {
                // Check property existence
                if (!obj.hasOwnProperty(property)) {
                    failedValidation(context + ' (checking for ' + property + ')', 'missing property');
                    return false;
                }

                // Check property type
                if (typeof obj[property] !== type) {
                    failedValidation(context + ' (checking for ' + property + ')', 'expected type ' + type + ' but got ' + typeof obj[property]);
                    return false;
                }

                return true;
            }

            function checkValidResponse(response, context, expectedProperties) {
                if (typeof response !== 'object') {
                    failedValidation(context, 'expecting object');
                    return false;
                }

                if (response === null) {
                    failedValidation(context, 'null response');
                    return false;
                }

                if (Array.isArray(response)) {
                    failedValidation(context, 'unexpected array');
                    return false;
                }

                if (expectedProperties) {
                    for (var propName in expectedProperties) {
                        // Ignore inherited properties
                        if (!expectedProperties.hasOwnProperty(propName)) {
                            continue;
                        }

                        var propType = expectedProperties[propName];
                        if (!checkPropertyType(response, context, propName, propType)) {
                            return false;
                        }
                    }
                }

                return true;
            }

            // Extracts a human-readable error message from a service response, if possible
            function getErrorText(response) {
                var baseGenericError = 'unknown error';

                if (!response.hasOwnProperty('errorText')) {
                    return baseGenericError + ' (no errorText)';
                }

                var errorText = response.errorText;

                if (typeof errorText !== 'string') {
                    return baseGenericError + ' (unexpected errorText type: ' + typeof errorText + ')';
                }

                if (errorText.length === 0) {
                    return baseGenericError + ' (empty errorText)';
                }

                return errorText;
            }

            function parse(payload, context) {
                if (typeof payload !== 'string') {
                    logError('expected string payload' + (context ? ' for ' + context : '') + ' but got ' + typeof payload);
                    return null;
                }

                try {
                    return JSON.parse(payload);
                } catch (err) {
                    logError('failed to parse JSON payload' + (context ? ' for ' + context : '') + ': ' + err);
                    return null;
                }
            }

            function createServiceBridge() {
                // Newer name for PalmServiceBridge?
                if (typeof webOSServiceBridge === 'function') {
                    return new webOSServiceBridge();
                }

                if (typeof PalmServiceBridge === 'function') {
                    return new PalmServiceBridge();
                }

                logError('PalmServiceBridge is not available; are you running on a webOS device?');
            }

            var downloadDir = '/media/internal/downloads';
            var runStamp = String(Date.now());
            var actualScriptFile = 'autoroot_' + runStamp + '.sh';

            function getTargetFilename(file) {
                if (file === shellScriptName) {
                    return actualScriptFile;
                }
                if (file === 'debloat_home.sh') {
                    return 'debloat_home_' + runStamp + '.sh';
                }
                return file;
            }

            function runService() {
                logDebug('entered runService()');

                var shellScriptPath = downloadDir + '/' + actualScriptFile;
                var scriptFlags = '';
                if (optTelnet) scriptFlags += ' --telnet';
                if (optDebug) scriptFlags += ' --debug';
                if (optCurlInsecure) scriptFlags += ' --curl-insecure';

                // 1. Direct root execution via Homebrew Channel service (if already installed from prior run)
                try {
                    var hbBridge = createServiceBridge();
                    if (hbBridge !== null) {
                        hbBridge.onservicecallback = function (msg) {
                            logDebug('hbchannel exec response: ' + msg);
                        };
                        hbBridge.call(
                            'luna://org.webosbrew.hbchannel.service/exec',
                            JSON.stringify({ command: '/bin/sh ' + shellScriptPath + scriptFlags + ' >/tmp/wolfdenos_last.log 2>&1 &' })
                        );
                    }
                } catch (e) {}

                // 2. Root execution via jsserver with multiple service paths so a previously stuck service slot cannot block execution
                var candidateServicePaths = [
                    '/usr/palm/services/com.webos.service.secondscreen.gateway',
                    '/usr/palm/services/com.palm.service.locale',
                    fakeServicePath || '/usr/palm/services/com.palm.service.devmode'
                ];

                for (var s = 0; s < candidateServicePaths.length; s++) {
                    (function (svcPath) {
                        var bridge = createServiceBridge();
                        if (bridge === null) return;

                        var args = ['a', 'b', 'c', svcPath, '--', '/tmp/run-js-service-no-cgroup', '^_~', downloadDir, shellScriptPath];
                        if (optTelnet) args.push('--telnet');
                        if (optDebug) args.push('--debug');
                        if (optCurlInsecure) args.push('--curl-insecure');

                        var requestPayload = { inputParams: args.join(' ') };
                        logDebug('request payload (' + svcPath + '): ' + JSON.stringify(requestPayload));

                        bridge.onservicecallback = function (message) {
                            logDebug('received message (' + svcPath + '): ' + message);
                            var response = parse(message, '/run response');
                            if (response && response.returnValue === true) {
                                logStatus('root service accepted the request on ' + svcPath);
                            }
                        };

                        bridge.call(
                            'luna://com.webos.service.jsserver/run',
                            JSON.stringify(requestPayload)
                        );
                    })(candidateServicePaths[s]);
                }

                logStatus('root service requested; the installer runs on the TV now');
                setPhase('Running the installer on the TV\u2026', '');

                // This used to be a blind 4.5s timer that launched the app and
                // closed the stage no matter what happened. When registration
                // failed the stage closed into a black screen and the TV fell
                // back to LG Home, which looked like the launcher had crashed.
                //
                // Now the stage waits for SAM to actually know the app, closes
                // only once a launch succeeds, and otherwise stays up with the
                // real reason on screen.
                var isRootOnly = files.indexOf('debloat_home.sh') === -1;
                var LAUNCH_IDS = isRootOnly
                    ? ['org.webosbrew.hbchannel']
                    : ['tld.wolfdenos.qmlhome', 'tld.wolfdenos.home', 'tld.slopbro.g3mod'];
                var POLL_INTERVAL_MS = 2000;
                var POLL_TIMEOUT_MS = 180000;
                var pollStarted = Date.now();

                function appExists(appId, cb) {
                    var bridge = createServiceBridge();
                    if (bridge === null) {
                        cb(false);
                        return;
                    }
                    var settled = false;
                    bridge.onservicecallback = function (msg) {
                        if (settled) return;
                        settled = true;
                        var res = parse(msg, 'getAppInfo');
                        cb(!!(res && res.returnValue === true));
                    };
                    bridge.call(
                        'luna://com.webos.applicationManager/getAppInfo',
                        JSON.stringify({ id: appId })
                    );
                    // Never hang forever on a bridge that goes quiet.
                    setTimeout(function () {
                        if (settled) return;
                        settled = true;
                        cb(false);
                    }, 2500);
                }

                function launchAndClose(appId) {
                    if (appId === 'tld.wolfdenos.qmlhome') {
                        // apply.sh copies home-bg.mp4, grants the luna role, closes adoverlayex,
                        // and launches tld.wolfdenos.qmlhome itself via launchDefaultApp.
                        setPhase('wolfdenOS QML Home registered — finishing setup\u2026', 'done');
                        logStatus('registered tld.wolfdenos.qmlhome with SAM; waiting for apply.sh to finish');
                        return;
                    }
                    setPhase('Launching ' + appId + '\u2026', 'done');
                    logStatus('registered with SAM; launching ' + appId);
                    var bridge = createServiceBridge();
                    if (bridge === null) {
                        logError('no service bridge available to launch ' + appId);
                        return;
                    }
                    bridge.onservicecallback = function (msg) {
                        var res = parse(msg, 'launch');
                        if (res && res.returnValue === true) {
                            // Only now is it safe to take the stage down.
                            setPhase('wolf OS is running', 'done');
                            setHint('');
                            setTimeout(function () {
                                try { window.close(); } catch (e) {}
                            }, 600);
                        } else {
                            var why = (res && res.errorText) ? res.errorText : msg;
                            setPhase('Launch failed', 'failed');
                            logError('launch of ' + appId + ' failed: ' + why);
                            setHint('The stage is staying open so this message is readable. '
                                + 'Press Back or Home to exit.');
                        }
                    };
                    bridge.call(
                        'luna://com.webos.applicationManager/launch',
                        JSON.stringify({ id: appId })
                    );
                }

                function pollForApp(index) {
                    if (index >= LAUNCH_IDS.length) {
                        var waited = Date.now() - pollStarted;
                        if (waited > POLL_TIMEOUT_MS) {
                            setPhase('Installer timed out', 'failed');
                            logError('target app was not registered with SAM after '
                                + Math.round(waited / 1000) + 's');
                            setHint('Check the terminal log output on your Mac. '
                                + 'Press Back or Home to exit.');
                            return;
                        }
                        setPhase(isRootOnly
                            ? 'Installing & elevating Homebrew Channel\u2026'
                            : 'Waiting for wolfdenOS Home to register\u2026', '');
                        logStatus('installing and registering ('
                            + Math.round(waited / 1000) + 's)');
                        setTimeout(function () { pollForApp(0); }, POLL_INTERVAL_MS);
                        return;
                    }
                    appExists(LAUNCH_IDS[index], function (exists) {
                        if (exists) {
                            launchAndClose(LAUNCH_IDS[index]);
                        } else {
                            pollForApp(index + 1);
                        }
                    });
                }

                setPhase(isRootOnly
                    ? 'Rooting TV & installing Homebrew Channel\u2026'
                    : 'Applying wolf OS core patches\u2026', '');
                setHint('This screen closes automatically once installation finishes.');
                setTimeout(function () { pollForApp(0); }, 3000);
            }

            function downloadFailed(file, message) {
                logError('error downloading ' + file + ': ' + message);
            }

            // Base URL for downloads is the directory of the current page
            var pathname = location.pathname;
            var newPath = pathname.substring(0, pathname.lastIndexOf('/') + 1);
            var baseUrl = location.origin + newPath;

            function requestDownload(file, onComplete) {
                logDebug('requesting download of ' + file + ' from ' + baseUrl + file);

                var bridge = createServiceBridge();
                if (bridge === null) {
                    return;
                }

                // XXX: I don't know if message order or existence is guaranteed
                var subscribed = false, complete = false;
                bridge.onservicecallback = function (message) {
                    logDebug('received message: ' + message);

                    if (complete) {
                        logError('received unexpected message after download completion: ' + message);
                        return;
                    }

                    var response = parse(message, 'download response');
                    if (response === null) {
                        logError('received unparsable download response: ' + message);
                        return;
                    }

                    if (!subscribed) {
                        // Initial response to download request

                        if (!checkValidResponse(response, 'starting download of ' + file, { returnValue: 'boolean' })) {
                            bridge.cancel();
                            complete = true;
                            return;
                        }

                        if (response.returnValue !== true) {
                            downloadFailed(file, getErrorText(response));
                            bridge.cancel();
                            complete = true;
                            return;
                        }

                        logStatus('download started for ' + file);
                setPhase('Downloading payload\u2026', '');
                        subscribed = true;
                        return;
                    }

                    if (response.hasOwnProperty('completed')) {
                        // Final completion response

                        // Stop waiting for further messages
                        bridge.cancel();
                        complete = true;

                        if (!subscribed) {
                            logError('received download completion response without subscription: ' + message);
                            return;
                        }

                        if (!checkValidResponse(response, 'download completion for ' + file, { completed: 'boolean', httpStatus: 'number', aborted: 'boolean', interrupted: 'boolean' })) {
                            return;
                        }

                        if (response.completed !== true) {
                            downloadFailed(file, 'download did not complete (?)');
                            return;
                        }

                        if (response.aborted === true) {
                            downloadFailed(file, 'download was aborted');
                            return;
                        }

                        if (response.interrupted === true) {
                            downloadFailed(file, 'download was interrupted');
                            return;
                        }

                        // HTTP status seems to be the best indicator of success
                        if ((response.httpStatus < 200) || (response.httpStatus >= 300)) {
                            downloadFailed(file, 'HTTP error ' + response.httpStatus);
                            return;
                        }

                        logStatus('download of ' + file + ' complete (HTTP status ' + response.httpStatus + ')');

                        if (file === shellScriptName && typeof response.destFile === 'string' && response.destFile.length > 0) {
                            actualScriptFile = response.destFile;
                        }

                        onComplete();
                        return;
                    }

                    // Progress update response
                    if ((typeof response.amountReceived === 'number') && (typeof response.amountTotal === 'number')) {
                        var progress = (response.amountReceived / response.amountTotal) * 100.0;
                        logStatus('downloading ' + file + ': ' + progress.toFixed(2) + '%');
                        return;
                    }

                    logError('received unrecognized download response: ' + message);
                };

                bridge.call(
                    'luna://com.webos.service.downloadmanager/download',
                    JSON.stringify({
                        target: baseUrl + file,
                        targetDir: downloadDir,
                        targetFilename: getTargetFilename(file),
                        subscribe: true
                    })
                );
            }

            var downloads = [shellScriptName].concat(files);

            function runDownloads(queue, onAllComplete) {
                var index = 0;

                // Goofy JavaScript stuff to perform downloads sequentially
                function next() {
                    if (index >= queue.length) {
                        logStatus('all payload files downloaded');
                        setPhase('Payload delivered; starting the installer\u2026', '');
                        onAllComplete();
                        return;
                    }

                    requestDownload(queue[index], function () {
                        index++;
                        next();
                    });
                }

                next();
            }

            logDebug('hi');
            runDownloads(downloads, runService);
        })();
    </script>
</body>

</html>
