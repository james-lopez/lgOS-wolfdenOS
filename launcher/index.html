<!DOCTYPE html>
<html lang="en">
<head>

<title>wolfdenOS — Glass Dock Home</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #090414; color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  }
  #stage {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 58px 84px 64px 84px;
    background:
      radial-gradient(circle at 22% 18%, rgba(139, 92, 246, 0.36) 0%, transparent 48%),
      radial-gradient(circle at 78% 28%, rgba(192, 38, 211, 0.28) 0%, transparent 52%),
      radial-gradient(circle at 50% 78%, rgba(109, 40, 217, 0.42) 0%, rgba(30, 11, 58, 0.92) 55%, #070312 100%);
    transition: background 0.6s ease;
  }
  #stage.bg-amethyst {
    background:
      radial-gradient(circle at 65% 22%, rgba(236, 72, 153, 0.32) 0%, transparent 50%),
      radial-gradient(circle at 30% 70%, rgba(124, 58, 237, 0.48) 0%, #090214 75%);
  }
  #stage.bg-midnight {
    background:
      radial-gradient(circle at 50% 60%, rgba(88, 28, 135, 0.38) 0%, #030108 75%);
  }
  /* Live video background. Sits above the gradient and below everything else;
     pointer-events none so it can never eat a remote press. */
  #live-bg {
    position: absolute; inset: 0; z-index: 1;
    overflow: hidden; pointer-events: none;
    opacity: 0; transition: opacity 1.2s ease;
  }
  #live-bg.ready { opacity: 1; }
  #live-bg iframe, #live-bg video {
    position: absolute; top: 50%; left: 50%;
    border: 0; pointer-events: none;
    /* 16:9 cover: overscan so there are never letterbox bars. The extra 1.35
       scale pushes the embed's own title bar and end-card chrome off-screen,
       since modestbranding no longer suppresses them. */
    width: 100vw; height: 56.25vw;
    min-height: 100vh; min-width: 177.78vh;
    transform: translate(-50%, -50%) scale(1.35);
  }
  #live-bg video {
    /* A local file has no chrome to hide, so it needs no overscan. */
    transform: translate(-50%, -50%);
  }
  /* Just enough scrim to keep the dock and clock legible. */
  #live-bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(to top, rgba(5,2,10,.72) 0%, rgba(5,2,10,.12) 42%, rgba(5,2,10,.30) 100%);
  }
  /* The purple orbs fight with footage; fade them once video is up. */
  #stage.live .orb { opacity: 0.12; }

  /* Burn-in guard. Pure black means the OLED pixels are actually off, which
     is the point; the dim clock drifts so nothing is ever static. */
  #idle-veil {
    position: fixed; inset: 0; z-index: 9000;
    background: #000;
    opacity: 0; pointer-events: none;
    transition: opacity 1.6s ease;
  }
  #idle-veil.on { opacity: 1; pointer-events: auto; }
  #idle-clock {
    position: absolute;
    color: rgba(255, 255, 255, 0.13);
    font-size: 40px; font-weight: 300;
    transition: left 2s ease, top 2s ease;
  }

  /* Subtle ambient glow orbs */
  .orb {
    position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; opacity: 0.55;
  }
  .orb-1 { width: 540px; height: 540px; left: -120px; top: -100px; background: rgba(147, 51, 234, 0.45); }
  .orb-2 { width: 640px; height: 420px; right: -80px; bottom: 80px; background: rgba(192, 38, 211, 0.35); }
  .orb-3 { width: 720px; height: 340px; left: 28%; bottom: -60px; background: rgba(99, 102, 241, 0.35); }

  /* Top Bar: Clock (left) + 3 Minimal Outline Icons (right) */
  .top-bar {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
  }
  .clock-block {
    margin-left: auto;        /* top bar is otherwise empty now */
    position: relative;
    text-align: right;
    padding: 18px 26px 20px 48px;
    text-shadow:
      0 2px 6px rgba(0, 0, 0, 0.85),
      0 6px 28px rgba(0, 0, 0, 0.65);
  }
  /* Scrim sits behind the text only, so video still reads as the background. */
  .clock-block::before {
    content: ""; position: absolute; inset: -20px -30px -20px -70px;
    z-index: -1; border-radius: 50%;
    background: radial-gradient(ellipse at 70% 50%,
      rgba(5, 2, 12, 0.62) 0%, rgba(5, 2, 12, 0.34) 45%, rgba(5, 2, 12, 0) 72%);
  }
  .clock {
    font-size: 58px; font-weight: 300; letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.96);
    line-height: 1.05;
  }
  .clock .meridiem {
    font-size: 26px; font-weight: 400; margin-left: 10px;
    color: rgba(255, 255, 255, 0.72);
  }
  .clock-date {
    font-size: 30px; font-weight: 400; margin-top: 6px;
    color: rgba(224, 204, 255, 0.92);
  }
  .top-actions {
    display: flex; align-items: center; gap: 22px;
  }
  .top-btn {
    width: 48px; height: 48px; border-radius: 14px;
    border: 1px solid transparent; background: transparent;
    color: rgba(255, 255, 255, 0.65);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.18s ease;
  }
  .top-btn.focused, .top-btn:hover {
    color: #ffffff; background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.32);
    transform: scale(1.08);
  }
  .top-btn svg { width: 28px; height: 28px; stroke-width: 1.75; }

  /* Center Status / Edit Mode Banner */
  .center-stage {
    position: relative; z-index: 10;
    margin: auto; text-align: center;
  }
  .mode-pill {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 12px 26px; border-radius: 999px;
    background: rgba(24, 12, 48, 0.78);
    border: 1px solid rgba(192, 132, 252, 0.45);
    backdrop-filter: blur(20px);
    font-size: 20px; color: #f3e8ff;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    opacity: 0; transform: translateY(10px); transition: all 0.2s ease;
  }
  .mode-pill.visible { opacity: 1; transform: translateY(0); }

  /* All Apps Drawer Modal */
  #drawer-modal {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(8, 3, 18, 0.86); backdrop-filter: blur(28px);
    display: none; flex-direction: column; padding: 64px 96px;
  }
  #drawer-modal.open { display: flex; }
  .drawer-header {
    justify-content: center;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 36px;
  }
  .drawer-title {
    font-size: 40px; font-weight: 500; color: #fff;
    width: 100%; text-align: center;
  }
  .drawer-sub { font-size: 18px; color: rgba(255,255,255,0.6); }
  .drawer-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 22px;
    overflow-y: auto; padding-bottom: 40px;
  }
  .drawer-card {
    padding: 22px 18px; border-radius: 22px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; cursor: pointer; transition: all 0.16s ease;
  }
  .drawer-card.focused, .drawer-card:hover {
    background: rgba(168, 85, 247, 0.28); border-color: #e9d5ff;
    transform: scale(1.04);
  }
  .drawer-card .d-art {
    width: 92px; height: 92px; margin: 0 auto 10px auto;
    display: flex; align-items: center; justify-content: center;
  }
  .drawer-card .d-art img.tv-icon {
    width: 92px; height: 92px; object-fit: contain; border-radius: 18px;
  }
  .drawer-card .d-art svg { width: 56px; height: 56px; fill: #fff; }
  .drawer-card .d-title { font-size: 19px; font-weight: 500; color: #fff; }
  .drawer-card .d-status { font-size: 13px; color: #d8b4fe; text-transform: uppercase; letter-spacing: 0.06em; }

  /* Bottom Horizontal Glass Dock Area */
  .dock-wrapper {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    width: 100%;
  }
  .glass-dock {
    display: flex; align-items: center; justify-content: center;
    gap: 28px; padding: 24px 46px;
    max-width: 92vw; overflow-x: auto; scrollbar-width: none;
    border-radius: 38px;
    background: rgba(255, 255, 255, 0.075);
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    box-shadow:
      0 24px 68px rgba(0, 0, 0, 0.62),
      inset 0 1px 1px rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  }
  .glass-dock::-webkit-scrollbar { display: none; }

  .dock-item {
    position: relative;
    width: 168px; height: 140px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 22px; cursor: pointer;
    opacity: 0.48; transform: scale(1);
    transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    flex-shrink: 0;
  }
  .dock-item.focused {
    opacity: 1; transform: scale(1.12);
    filter: drop-shadow(0 6px 20px rgba(255, 255, 255, 0.45));
  }
  .dock-item.reordering {
    opacity: 1; transform: translateY(-14px) scale(1.26);
    background: rgba(168, 85, 247, 0.32);
    border: 2px solid #f3e8ff;
    box-shadow: 0 14px 34px rgba(168, 85, 247, 0.55);
  }
  .dock-item svg {
    width: 92px; height: 92px; fill: #ffffff; color: #ffffff;
  }
  /* The All Apps glyph is stroked, not filled: the rule above would turn its
     four squares into solid blocks. */
  .dock-item.allapps svg {
    width: 72px; height: 72px; fill: none; stroke: #ffffff;
  }
  .dock-item img.tv-icon {
    width: 116px; height: 116px; object-fit: contain;
    border-radius: 24px;
  }

  /* Active App Label Row Directly Beneath Focused Icon (Outside Dock) */
  .dock-label-row {
    height: 44px; margin-top: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  #active-app-label {
    font-size: 28px; font-weight: 500; letter-spacing: 0.01em;
    color: rgba(255, 255, 255, 0.96);
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
    transition: all 0.15s ease;
  }
  /* The hint line that used to sit under the app name is gone: it was small,
     permanent, and said the same thing forever. */
</style>
</head>

<script>
  const FALLBACK_APPS = [{"id":"youtube.leanback.v4","name":"YouTube","subtitle":"4K HDR · 60fps","category":"Streaming","accentColor":"#ef4444","tileBgColor":"#ffffff","tileTextColor":"#111111","iconKey":"youtube","enabled":true},{"id":"com.disney.disneyplus-prod","name":"Disney+","subtitle":"IMAX Enhanced · 4K","category":"Streaming","accentColor":"#38bdf8","tileBgColor":"#061539","tileTextColor":"#ffffff","iconKey":"disney","enabled":true},{"id":"hulu","name":"Hulu","subtitle":"FX · Originals · Live","category":"Streaming","accentColor":"#1ce783","tileBgColor":"#0b1a14","tileTextColor":"#1ce783","iconKey":"hulu","enabled":true},{"id":"com.apple.appletv","name":"Apple TV","subtitle":"4K Dolby Vision","category":"Streaming","accentColor":"#e4e4e7","tileBgColor":"#18181b","tileTextColor":"#ffffff","iconKey":"appletv","enabled":true},{"id":"com.wbd.stream","name":"HBO Max","subtitle":"Dolby Vision · Atmos","category":"Streaming","accentColor":"#8b5cf6","tileBgColor":"#160d2e","tileTextColor":"#ffffff","iconKey":"hbomax","enabled":true},{"id":"amazon","name":"Prime Video","subtitle":"UHD HDR10+","category":"Streaming","accentColor":"#00a8e1","tileBgColor":"#0f172a","tileTextColor":"#ffffff","iconKey":"prime","enabled":true},{"id":"com.cbs-all-access.webapp.prod","name":"Paramount+","subtitle":"Peak Streaming · CBS","category":"Streaming","accentColor":"#0064ff","tileBgColor":"#071633","tileTextColor":"#ffffff","iconKey":"paramount","enabled":true},{"id":"com.crunchyroll.webapp","name":"Crunchyroll","subtitle":"Anime Simulcast · 1080p","category":"Streaming","accentColor":"#f47521","tileBgColor":"#241104","tileTextColor":"#ffffff","iconKey":"crunchyroll","enabled":true},{"id":"com.peacock.tv","name":"Peacock","subtitle":"NBC · Live Sports & Movies","category":"Streaming","accentColor":"#facc15","tileBgColor":"#141418","tileTextColor":"#ffffff","iconKey":"peacock","enabled":true},{"id":"com.microsoft.xbox","name":"Xbox","subtitle":"Cloud Gaming · 60fps","category":"Gaming & Inputs","accentColor":"#107c10","tileBgColor":"#0c210c","tileTextColor":"#ffffff","iconKey":"xbox","enabled":true},{"id":"com.tubitv.ott.tubi","name":"Tubi","subtitle":"Free Movies & TV","category":"Streaming","accentColor":"#fa382f","tileBgColor":"#220918","tileTextColor":"#ffffff","iconKey":"tubi","enabled":true},{"id":"com.plutotv.app","name":"Pluto TV","subtitle":"Live Channels · On Demand","category":"Streaming","accentColor":"#fff200","tileBgColor":"#141414","tileTextColor":"#fff200","iconKey":"plutotv","enabled":true},{"id":"com.movenetworks.app.sling-tv-sling-production","name":"Sling TV","subtitle":"Live TV Channels","category":"Streaming","accentColor":"#0076ff","tileBgColor":"#0b192e","tileTextColor":"#ffffff","iconKey":"sling","enabled":true},{"id":"tv.orka.lgtv","name":"OrkaTV","subtitle":"Installed Channel App","category":"Streaming","accentColor":"#38bdf8","tileBgColor":"#0c1926","tileTextColor":"#ffffff","iconKey":"orka","enabled":true},{"id":"org.webosbrew.hbchannel","name":"Homebrew Channel","subtitle":"Root Services & Mods","category":"System","accentColor":"#c084fc","tileBgColor":"#27170c","tileTextColor":"#ffffff","iconKey":"homebrew","enabled":true}];
  // ---------------------------------------------------------------------
  // Live background.
  //
  // mode "youtube": plays a video through YouTube's own iframe player.
  //   Autoplay only works muted, which is what a background wants anyway.
  //   Needs the network to be up; until it loads (or if it never does) the
  //   purple gradient underneath is what shows, so this can only ever add.
  // mode "video":   a file on the TV, e.g. "/media/internal/bg/autumn.mp4".
  //   Costs nothing at runtime and works offline; best for a season you keep.
  // mode "none":    gradient only.
  //
  // Swap SEASON to change the look; add your own entries as you go.
  // Default "none" until the TV's clock is right: with the system time wrong,
  // TLS validation fails and the webview throws a "certificate has expired /
  // check current time" (-201) dialog over the home screen. Press B to cycle
  // it back to youtube once time is fixed, or set this back to "youtube".
  // YouTube returns error 153 here: this app is served from a file:// origin,
  // and the embed refuses a request with no valid HTTP referrer. That is a
  // property of the embed, not a setting, so the YouTube path cannot work
  // from inside the launcher. "video" plays a file from the TV and has none
  // of these problems.
  const LIVE_BG = {
    mode: "video",
    youtubeId: "p1b2tWu4XkE",
    videoSrc: "bg.mp4"
  };
  const STORAGE_BG_KEY = "lgos_live_bg_v1";

  // ---------------------------------------------------------------------
  // Idle handling.
  //
  // A looping <video> counts as active media playback, so webOS never starts
  // its screen saver and the dock sits lit indefinitely. On an OLED that is a
  // burn-in risk. So: pause the video after a short idle, which releases the
  // playback state and lets the TV's own screen saver do its job; then, as a
  // backstop in case it still does not, black the panel out ourselves.
  const IDLE_PAUSE_MS = 2 * 60 * 1000;   // stop the video, let the TV idle
  const IDLE_BLACK_MS = 5 * 60 * 1000;   // our own blackout
  const IDLE_DRIFT_MS = 30 * 1000;       // reposition the dim clock

  let idlePauseTimer = null;
  let idleBlackTimer = null;
  let idleDriftTimer = null;
  let idleBlacked = false;

  function positionIdleClock() {
    const el = document.getElementById("idle-clock");
    if (!el) return;
    const d = new Date();
    const h = d.getHours() % 12 || 12;
    const m = String(d.getMinutes()).padStart(2, "0");
    el.textContent = h + ":" + m;
    // Keep well inside the panel so nothing clips, and never repeat a spot.
    el.style.left = (8 + Math.random() * 74) + "%";
    el.style.top = (10 + Math.random() * 70) + "%";
  }

  function enterIdleBlack() {
    if (idleBlacked) return;
    idleBlacked = true;
    const veil = document.getElementById("idle-veil");
    if (veil) veil.className = "on";
    positionIdleClock();
    idleDriftTimer = setInterval(positionIdleClock, IDLE_DRIFT_MS);
  }

  function pauseBackgroundForIdle() {
    const v = document.querySelector("#live-bg video");
    if (v && !v.paused) {
      try { v.pause(); } catch (e) {}
    }
  }

  function resumeBackgroundFromIdle() {
    const v = document.querySelector("#live-bg video");
    if (v && v.paused) {
      // play() rejects if the TV blocks it; the gradient is still behind.
      try { const r = v.play(); if (r && r.catch) r.catch(function () {}); } catch (e) {}
    }
  }

  function noteActivity() {
    if (idleBlacked) {
      idleBlacked = false;
      const veil = document.getElementById("idle-veil");
      if (veil) veil.className = "";
      if (idleDriftTimer) { clearInterval(idleDriftTimer); idleDriftTimer = null; }
    }
    resumeBackgroundFromIdle();
    if (idlePauseTimer) clearTimeout(idlePauseTimer);
    if (idleBlackTimer) clearTimeout(idleBlackTimer);
    idlePauseTimer = setTimeout(pauseBackgroundForIdle, IDLE_PAUSE_MS);
    idleBlackTimer = setTimeout(enterIdleBlack, IDLE_BLACK_MS);
  }

  // Capture phase so this runs even when a handler stops propagation.
  ["keydown", "keyup", "mousemove", "click", "wheel"].forEach(function (evt) {
    window.addEventListener(evt, noteActivity, true);
  });
  noteActivity();

  function startLiveBackground() {
    const host = document.getElementById("live-bg");
    if (!host) return;
    // A saved override wins, so the mode can be flipped on the TV (press B)
    // without rebuilding and redeploying the app.
    let mode = LIVE_BG.mode;
    try {
      const saved = localStorage.getItem(STORAGE_BG_KEY);
      if (saved) mode = saved;
    } catch (e) {}

    host.innerHTML = "";
    host.className = "";
    document.getElementById("stage").classList.remove("live");
    if (mode === "none") return;

    if (mode === "video" && LIVE_BG.videoSrc) {
      const v = document.createElement("video");
      v.src = LIVE_BG.videoSrc;
      v.autoplay = true; v.loop = true; v.muted = true;
      v.setAttribute("playsinline", "");
      v.onloadeddata = () => {
        host.className = "ready";
        document.getElementById("stage").classList.add("live");
      };
      host.appendChild(v);
      return;
    }

    if (mode === "youtube" && LIVE_BG.youtubeId) {
      const id = encodeURIComponent(LIVE_BG.youtubeId);
      const frame = document.createElement("iframe");
      // playlist=<id> is what makes a single video loop.
      frame.src = "https://www.youtube.com/embed/" + id +
        "?autoplay=1&mute=1&controls=0&loop=1&playlist=" + id +
        "&playsinline=1&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1";
      frame.allow = "autoplay; encrypted-media";
      frame.setAttribute("frameborder", "0");
      frame.onload = () => {
        host.className = "ready";
        document.getElementById("stage").classList.add("live");
      };
      host.appendChild(frame);
      // If the embed is blocked it simply never fades in; the gradient stays.
      setTimeout(() => {
        if (host.className !== "ready") {
          console.log("[wolfdenOS] live background did not load; using gradient");
        }
      }, 8000);
    }
  }

  function cycleLiveBackground() {
    const order = ["youtube", "video", "none"];
    let mode = LIVE_BG.mode;
    try { mode = localStorage.getItem(STORAGE_BG_KEY) || LIVE_BG.mode; } catch (e) {}
    const next = order[(order.indexOf(mode) + 1) % order.length];
    try { localStorage.setItem(STORAGE_BG_KEY, next); } catch (e) {}
    startLiveBackground();
  }

  const STORAGE_ORDER_KEY = "lgos_dock_order_v3";
  const STORAGE_HIDDEN_KEY = "lgos_dock_hidden_v3";

  // Noise-free filter: exclude internal webOS background stubs & removed LG system bloat apps

  // System utility apps that are available in the All Apps drawer (middle top-right button)
  // but hidden from the main dock by default unless the user toggles them on
  // The dock starts with these four; everything else installed lives in the
  // All Apps grid and can be toggled onto the dock from there.
  const DEFAULT_DOCK_IDS = [
    "youtube.leanback.v4",
    "com.disney.disneyplus-prod",
    "hulu",
    "amazon"
  ];

  const DEFAULT_DRAWER_ONLY = new Set([
    // com.webos.app.discovery (LG "Apps") is uninstalled by debloat_home.sh
    // because its backend never loads; it is filtered out entirely below.
    "com.webos.app.livetv"
  ]);

  // Clean monochrome SVG brand icons matching the Glass Dock aesthetic for all installed apps on your OLED65G3PUA
  function getBrandSvg(id, title) {

    if (key.includes("homeconnect") || key.includes("hdmi")) {
      return '<svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>';
    }
    if (key.includes("browser")) {
      return '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>';

  let allInstalledApps = [];
  let dockApps = [];
  let hiddenIds = new Set();

  // Everything that is not one of the four mains starts in All Apps.
  function defaultHiddenIds() {
    const keep = new Set(DEFAULT_DOCK_IDS);
    const hidden = new Set(DEFAULT_DRAWER_ONLY);
    for (const app of allInstalledApps) {
      if (!keep.has(app.id)) hidden.add(app.id);
    }
    return hidden;
  }
  let focusZone = "dock"; // "dock" | "top" | "drawer"
  let dockIdx = 0;
  let topIdx = 0;
  let drawerIdx = 0;
  let reorderMode = false;
  let okHoldTimer = null;
  let okLongPressed = false;
  let bgThemeIdx = 0;
  const BG_THEMES = ["", "bg-amethyst", "bg-midnight"];

  let hasSavedHidden = false;
  try {
    const rawHidden = localStorage.getItem(STORAGE_HIDDEN_KEY);
    if (rawHidden !== null) {
      hasSavedHidden = true;
      hiddenIds = new Set(JSON.parse(rawHidden));
    } else {
      hiddenIds = defaultHiddenIds();
    }
  } catch (e) {
    hiddenIds = defaultHiddenIds();
  }

  function applySavedOrder(list) {
    try {
      const savedOrder = JSON.parse(localStorage.getItem(STORAGE_ORDER_KEY) || "[]");
      if (Array.isArray(savedOrder) && savedOrder.length > 0) {
        const rank = new Map(savedOrder.map((id, i) => [id, i]));
        list.sort((a, b) => {
          const ra = rank.has(a.id) ? rank.get(a.id) : 9999;
          const rb = rank.has(b.id) ? rank.get(b.id) : 9999;
          return ra - rb;
        });
      }
    } catch (e) {}
    return list;
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_ORDER_KEY, JSON.stringify(dockApps.map(a => a.id)));
      localStorage.setItem(STORAGE_HIDDEN_KEY, JSON.stringify(Array.from(hiddenIds)));
      hasSavedHidden = true;
    } catch (e) {}
  }

  function rebuildDockApps() {
    // defaultHiddenIds() needs the installed app list, which arrives after
    // this module loads. Until the user saves their own dock, recompute the
    // default here so the four mains actually take effect.
    if (!hasSavedHidden) hiddenIds = defaultHiddenIds();
    const visible = allInstalledApps.filter(a => !hiddenIds.has(a.id));
    dockApps = applySavedOrder(visible);
    if (dockIdx >= dockApps.length) dockIdx = Math.max(0, dockApps.length - 1);
  }

  // On the TV, listLaunchPoints returns an absolute filesystem path
  // ("/usr/palm/applications/<id>/icon.png"). Used as-is in an <img>, that
  // resolves against the app's own file:// origin and 404s, which is why every
  // tile fell back to the white brand glyph. Over SSAP the same field comes
  // back as an https URL instead, so handle both.
  function normalizeIconPath(raw) {
    const path = String(raw || "").trim();
    if (!path) return "";
    if (/^(file|https?|data):/i.test(path)) return path;
    if (path.charAt(0) === "/") return "file://" + path;
    return path;
  }

  function ingestLaunchPoints(lps) {
    if (!Array.isArray(lps) || lps.length === 0) return;
    const mapped = [];
    const seen = new Set();
    for (const lp of lps) {
      const id = lp.id;
      if (!id || seen.has(id) || INTERNAL_STUBS.has(id)) continue;
      if (lp.visible === false) continue;
      seen.add(id);
      mapped.push({
        id: id,
        name: lp.title || id,
        // apply.sh copies each app's real artwork to icons/<id>.png beside
        // this app, because the sandbox blocks reading the originals from
        // /media/cryptofs. If a copy is missing, onerror falls back to the glyph.
        iconPath: "icons/" + id + ".png"
      });
    }
    if (mapped.length > 0) {
      allInstalledApps = mapped;
      rebuildDockApps();
      render();
    }
  }

  // 1. Load fallback list immediately, then query real TV launch points via Luna / dumped JSON
  allInstalledApps = FALLBACK_APPS.map(a => ({ id: a.id, name: a.name, iconPath: "" }));
  rebuildDockApps();

  // Attempt to load pre-dumped tv-launchpoints.json from debloat_home.sh
  fetch("./tv-launchpoints.json")
    .then(r => r.json())
    .then(data => {
      if (data && Array.isArray(data.launchPoints)) {
        ingestLaunchPoints(data.launchPoints);
      } else if (data && data.payload && Array.isArray(data.payload.launchPoints)) {
        ingestLaunchPoints(data.payload.launchPoints);
      }
    })
    .catch(() => {});

  // Also query live via PalmServiceBridge on the TV
  try {
    if (window.PalmServiceBridge) {
      const bridge = new PalmServiceBridge();
      bridge.onservicecallback = function(msg) {
        try {
          const parsed = JSON.parse(msg);
          if (parsed && Array.isArray(parsed.launchPoints)) {
            ingestLaunchPoints(parsed.launchPoints);
          }
        } catch (e) {}
      };
      bridge.call("luna://com.webos.applicationManager/listLaunchPoints", "{}");
    }
  } catch (e) {}

  function updateClock() {
    const d = new Date();
    const h = d.getHours() % 12 || 12;
    const m = String(d.getMinutes()).padStart(2, "0");
    // Without the meridiem, 22:12 renders as "10:12" and reads as wrong.
    const mer = d.getHours() < 12 ? "AM" : "PM";
    document.getElementById("clock").innerHTML =
      h + ":" + m + '<span class="meridiem">' + mer + "</span>";
    const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const months = ["January", "February", "March", "April", "May", "June",
                    "July", "August", "September", "October", "November", "December"];
    document.getElementById("clock-date").textContent =
      days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate();
  }
  // Tick near the top of each minute so the displayed time is never stale.
  setInterval(updateClock, 15000);
  updateClock();
  startLiveBackground();

  function launchApp(appId) {
    if (window.PalmServiceBridge) {
      const b = new PalmServiceBridge();
      b.call("luna://com.webos.applicationManager/launch", JSON.stringify({ id: appId }));
    } else if (window.webOS && window.webOS.service) {
      window.webOS.service.request("luna://com.webos.applicationManager", {
        method: "launch",
        parameters: { id: appId }
      });
    }
  }

  let dockSignature = null;

  // Real TV artwork when the launch point gave us a URL, brand glyph otherwise.
  function tileMarkup(app) {
    if (app.iconPath) {
      const safe = String(app.iconPath).replace(/"/g, "&quot;");
      const fallback = getBrandSvg(app.id, app.name).replace(/"/g, "&quot;");
      return '<img class="tv-icon" src="' + safe + '" alt="" ' +
             'onerror="this.parentNode.innerHTML=this.getAttribute(\'data-fb\')" ' +
             'data-fb="' + fallback + '">';
    }
    return getBrandSvg(app.id, app.name);
  }

  function buildDock() {
    const dockEl = document.getElementById("glass-dock");
    dockEl.innerHTML = "";
    dockApps.forEach((app, i) => {
      const item = document.createElement("div");
      item.className = "dock-item";
      item.innerHTML = tileMarkup(app);
      item.onclick = () => {
        focusZone = "dock";
        dockIdx = i;
        if (reorderMode) {
          reorderMode = false;
          saveState();
          render();
        } else {
          render();
          launchApp(app.id);
        }
      };
      dockEl.appendChild(item);
    });

    // All Apps lives at the end of the dock now that the top-right buttons
    // are gone. It is the only way into the grid, so it is never hidden.
    const allTile = document.createElement("div");
    allTile.className = "dock-item allapps";
    allTile.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">' +
      '<rect width="7" height="7" x="3" y="3" rx="1.4"/>' +
      '<rect width="7" height="7" x="14" y="3" rx="1.4"/>' +
      '<rect width="7" height="7" x="3" y="14" rx="1.4"/>' +
      '<rect width="7" height="7" x="14" y="14" rx="1.4"/></svg>';
    allTile.onclick = () => { openAllApps(); };
    dockEl.appendChild(allTile);
  }

  function openAllApps() {
    drawerIdx = 0;
    focusZone = "drawer";
    render();
  }

  // Dock index == dockApps.length means the All Apps tile is focused.
  function allAppsFocused() {
    return focusZone === "dock" && dockIdx === dockApps.length;
  }

  function updateDockFocus() {
    const dockEl = document.getElementById("glass-dock");
    const items = dockEl.children;
    for (let i = 0; i < items.length; i++) {
      const isFocused = focusZone === "dock" && i === dockIdx;
      const isAll = i === dockApps.length;
      let cls = "dock-item" + (isAll ? " allapps" : "");
      if (isFocused) cls += " focused";
      if (isFocused && reorderMode && !isAll) cls += " reordering";
      if (items[i].className !== cls) items[i].className = cls;
      // Only scroll when the row genuinely overflows. Calling scrollIntoView
      // on a dock that already fits still nudges the container, which is what
      // made the row slide sideways when moving across it.
      if (isFocused && items[i].scrollIntoView &&
          dockEl.scrollWidth > dockEl.clientWidth + 1) {
        items[i].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
      }
    }
  }

  function render() {
    // Top buttons focus state

    // Mode pill
    const pill = document.getElementById("mode-pill");
    pill.className = "mode-pill" + (reorderMode ? " visible" : "");

    // Dock items.
    //
    // This used to wipe the dock with innerHTML="" and rebuild every tile on
    // each keypress, then call smooth scrollIntoView on a brand-new node.
    // Fresh elements have no previous state, so the CSS transition never ran
    // (nothing felt snappy) and the in-flight scroll restarted from a relaid
    // out row (the sideways shift). Structure is now built only when the dock
    // contents actually change; navigation just moves a class.
    // Must include the icon path, not just the id. The fallback list and the
    // real launch points share the same four ids, so an id-only signature
    // stayed identical when the real artwork arrived and the dock was never
    // rebuilt: every tile kept the placeholder glyph it was born with.
    const signature = dockApps.map(a => a.id + "@" + (a.iconPath || "")).join("|");
    if (signature !== dockSignature) {
      dockSignature = signature;
      buildDock();
    }
    updateDockFocus();

    // Label below dock
    const labelEl = document.getElementById("active-app-label");
    if (allAppsFocused()) {
      labelEl.textContent = "All Apps";
    } else {
      const activeApp = dockApps[dockIdx];
      labelEl.textContent = activeApp ? activeApp.name : "No Apps in Dock";
    }

    // Drawer modal
    const drawerModal = document.getElementById("drawer-modal");
    drawerModal.className = focusZone === "drawer" ? "open" : "";
    if (focusZone === "drawer") {
      const gridEl = document.getElementById("drawer-grid");
      gridEl.innerHTML = "";
      allInstalledApps.forEach((app, i) => {
        const card = document.createElement("div");
        const onDock = !hiddenIds.has(app.id);
        card.className = "drawer-card" + (i === drawerIdx ? " focused" : "");
        card.innerHTML =
          '<div class="d-art">' + tileMarkup(app) + '</div>' +
          '<div class="d-title">' + app.name + '</div>' +
          '<div class="d-status">' + (onDock ? "On Dock" : "") + '</div>';
        card.onclick = () => {
          drawerIdx = i;
          if (hiddenIds.has(app.id)) hiddenIds.delete(app.id);
          else hiddenIds.add(app.id);
          rebuildDockApps();
          saveState();
          render();
        };
        gridEl.appendChild(card);
      });
    }
  }

  // Top bar click handlers

  // Remote Key Handling (including Long-Press / Hard-Press OK to Move/Delete)
  window.addEventListener("keydown", (e) => {
    const code = e.keyCode || e.which;
    const isOk = e.key === "Enter" || code === 13;
    const isLeft = e.key === "ArrowLeft" || code === 37;
    const isUp = e.key === "ArrowUp" || code === 38;
    const isRight = e.key === "ArrowRight" || code === 39;
    const isDown = e.key === "ArrowDown" || code === 40;
    if (e.key === "b" || e.key === "B") { cycleLiveBackground(); return; }
    const isBack = e.key === "Escape" || e.key === "Backspace" || code === 461 || code === 27 || code === 8;

    if (isOk) {
      e.preventDefault();
      if (e.repeat) return;
      if (focusZone === "dock" && !allAppsFocused() && !okHoldTimer) {
        okLongPressed = false;
        okHoldTimer = setTimeout(() => {
          okLongPressed = true;
          reorderMode = !reorderMode;
          saveState();
          render();
        }, 520);
      }
      return;
    }

    if (focusZone === "drawer") {
      if (isRight) { drawerIdx = (drawerIdx + 1) % allInstalledApps.length; render(); }
      else if (isLeft) { drawerIdx = (drawerIdx - 1 + allInstalledApps.length) % allInstalledApps.length; render(); }
      else if (isDown) { drawerIdx = Math.min(allInstalledApps.length - 1, drawerIdx + 6); render(); }
      else if (isUp) { drawerIdx = Math.max(0, drawerIdx - 6); render(); }
      else if (isBack) { focusZone = "dock"; render(); }
      return;
    }


    // Dock zone navigation
    if (reorderMode) {
      if (isLeft && dockIdx > 0) {
        const tmp = dockApps[dockIdx - 1];
        dockApps[dockIdx - 1] = dockApps[dockIdx];
        dockApps[dockIdx] = tmp;
        dockIdx--;
        saveState();
        render();
      } else if (isRight && dockIdx < dockApps.length - 1) {
        const tmp = dockApps[dockIdx + 1];
        dockApps[dockIdx + 1] = dockApps[dockIdx];
        dockApps[dockIdx] = tmp;
        dockIdx++;
        saveState();
        render();
      } else if (isDown) {
        // Delete / remove from dock
        const removed = dockApps[dockIdx];
        if (removed && dockApps.length > 1) {
          hiddenIds.add(removed.id);
          rebuildDockApps();
          saveState();
          render();
        }
      } else if (isBack) {
        reorderMode = false;
        saveState();
        render();
      }
    } else {
      // length + 1 because the All Apps tile sits at the end of the row.
      const span = dockApps.length + 1;
      if (isRight) {
        dockIdx = (dockIdx + 1) % span;
        render();
      } else if (isLeft) {
        dockIdx = (dockIdx - 1 + span) % span;
        render();
      } else if (isUp) {
        openAllApps();
      }
    }
  });

  window.addEventListener("keyup", (e) => {
    const code = e.keyCode || e.which;
    const isOk = e.key === "Enter" || code === 13;
    if (!isOk) return;
    e.preventDefault();
    if (okHoldTimer) {
      clearTimeout(okHoldTimer);
      okHoldTimer = null;
    }
    if (okLongPressed) {
      okLongPressed = false;
      return;
    }
    if (focusZone === "dock") {
      if (reorderMode) {
        reorderMode = false;
        saveState();
        render();
      } else if (allAppsFocused()) {
        // The tile sits one past the end of dockApps, so this index has no
        // app behind it and OK used to fall through and do nothing.
        openAllApps();
      } else if (dockApps[dockIdx]) {
        launchApp(dockApps[dockIdx].id);
      }
    } else if (false) {
    } else if (focusZone === "drawer") {
      const app = allInstalledApps[drawerIdx];
      if (app) {
        if (hiddenIds.has(app.id)) hiddenIds.delete(app.id);
        else hiddenIds.add(app.id);
        rebuildDockApps();
        saveState();
        render();
      }
    }
  });

  render();
</script>
</body>
</html>
